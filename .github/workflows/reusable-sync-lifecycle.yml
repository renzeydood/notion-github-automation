name: Reusable - sync Notion lifecycle
on:
  workflow_call:
    inputs:
      database_id: {required: true, type: string}
      data_source_id: {required: false, type: string, default: ''}
    secrets:
      notion_token: {required: true}
      automation_repo_token: {required: true}
permissions:
  contents: read
jobs:
  sync:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'delete' && github.event.ref_type == 'branch')
    runs-on: ubuntu-latest
    steps:
      - name: Check out shared automation code
        uses: actions/checkout@v4
        with:
          repository: renzeydood/notion-github-automation
          ref: main
          token: ${{ secrets.automation_repo_token }}
          persist-credentials: false
          path: automation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update Notion lifecycle
        env:
          NOTION_TOKEN: ${{ secrets.notion_token }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NOTION_DATABASE_ID: ${{ inputs.database_id }}
          NOTION_DATA_SOURCE_ID: ${{ inputs.data_source_id }}
        run: python automation/scripts/sync_github_lifecycle.py
